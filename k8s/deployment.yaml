apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: my-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-frontend
  template:
    metadata:
      labels:
        app: my-frontend
    spec:
      containers:
      - name: web-app
        # ⚠️ Replace 'your_dockerhub_username' with your actual Docker Hub username below:
        image: vijay551001/my-first-devops-app:latest
        ports:
        - containerPort: 8000