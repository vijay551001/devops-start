name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Login securely to Docker Hub using your hidden secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: 'vijay551001'
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 2. Set up the Docker build environment on the cloud runner
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Build AND automatically upload the package to your Docker Hub registry

    - name: Build and Push Docker Image

      uses: docker/build-push-action@v5

      with:

        context: .

        push: true

        tags: vijay551001/my-first-devops-app:latest

 